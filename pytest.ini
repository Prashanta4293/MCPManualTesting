[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
addopts = -ra --tb=short --browser chromium --alluredir=allure-results --reruns 1 --output=test-results/pytest-native
markers =
    smoke: Homepage and header smoke coverage
    regression: Migrated browser regression coverage
    negative: Error and validation regression coverage
    positive: Positive visitor login with manual CAPTCHA
    visitor_login: Visitor account interface and authentication
    manual_captcha: Attended CAPTCHA entry followed by explicit tester confirmation
    flaky: Retry configuration supplied by pytest-rerunfailures
