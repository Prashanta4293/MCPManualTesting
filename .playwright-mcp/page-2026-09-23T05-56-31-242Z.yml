                - generic [ref=f85e880]: Celebrated across Odisha
              - paragraph [ref=f85e881]: Celebrated annually on 27 September, World Tourism Day is observed by the Department of Tourism, Government of Odisha, to showcase the state's diverse tourism offerings while promoting sustainable, responsible, and inclusive tourism. Through engaging public events and outreach activities, the celebration highlights Odisha's rich heritage, vibrant culture, natural wonders, and warm hospitality. The Department of Tourism commemorates World Tourism Day by organising a range of activities across the state, including heritage walks, guided tours, cultural performances, photography competitions, cleanliness drives at tourist destinations, awareness campaigns, stakeholder interactions, and recognition of individuals and organisations contributing to tourism promotion. The celebrations encourage citizens, students, tourism professionals, and visitors to rediscover Odisha's remarkable destinations while fostering responsible travel practices and community participation in tourism development.
